// GET /api/v1/customers?query=
let MOCK_CUSTOMERS = null;
function buildMockCustomers() {
  if (MOCK_CUSTOMERS) return MOCK_CUSTOMERS;
  const cats = ["원피스","니트","청바지","코트","가디건","액세서리","신발","가방"];
  const segs = ["growth","stable","dormant"];
  const weights = [0.143, 0.553, 0.304];
  const rows = [];
  for (let i = 1; i <= 60; i++) {
    const r = Math.random();
    let seg = "dormant"; let acc = 0;
    for (let j = 0; j < segs.length; j++) { acc += weights[j]; if (r <= acc) { seg = segs[j]; break; } }
    const base = seg === "growth" ? { recency: [8,25], freq: [1.6,3.0], amt: [3000000,8500000] }
               : seg === "stable" ? { recency: [25,75], freq: [0.5,1.6], amt: [300000,1400000] }
               : { recency: [90,220], freq: [0.1,0.7], amt: [20000,300000] };
    const rand = (a,b) => a + Math.random()*(b-a);
    rows.push({
      id: "CUST" + String(i).padStart(5,"0"),
      segment: seg,
      recency: Math.round(rand(...base.recency)),
      freq: rand(...base.freq).toFixed(2),
      amount: Math.round(rand(...base.amt)),
      topCategory: cats[Math.floor(Math.random()*cats.length)],
    });
  }
  MOCK_CUSTOMERS = rows;
  return rows;
}
async function apiSearchCustomers(query) {
  try { return await fetchJson("/api/v1/customers?query=" + encodeURIComponent(query)); }
  catch (e) {
    console.warn("백엔드 연결 실패, 목업 데이터 사용:", e.message);
    await delay(150);
    const rows = buildMockCustomers();
    const q = query.trim().toUpperCase();
    if (!q) return [];
    return rows.filter(r => r.id.includes(q)).slice(0, 20);
  }
}

// GET /api/v1/customers/:id/similar  (Neo4j 그래프 DB 탐색)
async function apiGetSimilarCustomers(customerId) {
  try {
    const res = await fetch(API_BASE + `/api/v1/customers/${encodeURIComponent(customerId)}/similar`);
    if (res.status === 500) {
      // 백엔드가 그래프 조회는 시도했지만 실패한 경우 (예: DB 이름 불일치, 인증 실패 등)
      const body = await res.json().catch(() => ({}));
      return { configured: true, similar: [], error: body.message || "그래프 조회 중 오류가 발생했습니다.", offline: false };
    }
    if (!res.ok) throw new Error("API error " + res.status);
    const body = await res.json();
    return { configured: body.configured, similar: body.similar, error: null, offline: false };
  } catch (e) {
    console.warn("백엔드 연결 실패:", e.message);
    return { configured: false, similar: [], error: null, offline: true };
  }
}

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtWon(n) { return n.toLocaleString() + "원"; }

const LOCAL_LOG_KEY = "customer_embedding_app_campaign_log";

function loadCampaignLog() {
  try {
    const raw = localStorage.getItem(LOCAL_LOG_KEY);
    if (!raw) return [];
    const items = JSON.parse(raw);
    return Array.isArray(items) ? items.sort((a, b) => b.ts - a.ts) : [];
  } catch (e) {
    console.error("localStorage 읽기 실패", e);
    return [];
  }
}
function saveCampaignLog(entry) {
  try {
    const current = loadCampaignLog();
    current.unshift(entry);
    localStorage.setItem(LOCAL_LOG_KEY, JSON.stringify(current));
  } catch (e) {
    console.error("localStorage 저장 실패", e);
  }
}

  try {
    await fetchJson("/api/v1/segments/summary");
    state.apiStatus = "connected";
  } catch (e) {
    state.apiStatus = "offline";
  }
  render();
}

async function init() {
  render();
  const [summary, trends, migration, log] = await Promise.all([
    apiGetSegmentSummary(), apiGetSegmentTrends(), apiGetMigrationMatrix(), Promise.resolve(loadCampaignLog()),
  ]);
  state.summary = summary; state.trends = trends; state.migration = migration; state.campaignLog = log;
  render();
  pingApi();
}

async function doSync() {
  state.syncing = true; render();
  const summary = await apiGetSegmentSummary();
  state.summary = summary;
  state.syncing = false;
  state.syncTime = new Date().toISOString().slice(0,16).replace("T"," ") + " (수동 동기화)";
  showToast("최신 세그먼트 데이터를 불러왔습니다.");
  render();
}

function setTab(tab) { state.tab = tab; render(); }
function setActiveSegment(id) { state.activeSegment = id; render(); }

async function doSearch(q) {
  state.searchQuery = q; state.searchLoading = true; state.similarFor = null; render();
  state.searchResults = await apiSearchCustomers(q);
  state.searchLoading = false; render();
}

async function showSimilarCustomers(customerId) {
  state.similarFor = customerId; state.similarLoading = true; state.similarError = null; render();
  const res = await apiGetSimilarCustomers(customerId);
  state.similarGraphConfigured = !res.offline;
  state.similarError = res.error;
  state.similarResults = res.similar;
  state.similarLoading = false; render();
}

function openSendModal(segmentId, message) { state.modal = { segmentId, message }; render(); }
function closeModal() { state.modal = null; render(); }

async function confirmSend() {
  const { segmentId, message } = state.modal;
  const seg = state.summary.segments.find(s => s.id === segmentId);
  const gateway = message[3];
  const res = await apiSendCampaign({
    target: { type: "segment", id: segmentId },
    channel: message[0],
    gateway,
    message_template_id: message[1],
    title: message[1],
    message: message[2],
    estimated_recipients: seg.n,
  });
  const entry = {
    log_id: res.log_id, segment: segmentId, segmentName: SEGMENT_META[segmentId].name,
    channel: message[0], gateway, copy: message[2],
    recipients: res.estimated_recipients, ts: Date.now(),
    status: res.status, provider: res.provider, detail: res.detail,
  };
  state.campaignLog.unshift(entry);
  saveCampaignLog(entry);
  state.modal = null;

  const statusLabel = { sent: "발송 완료", simulated: "발송 완료 (시뮬레이션)", partial: "일부만 발송됨", failed: "발송 실패", skipped: "발송 불가" }[res.status] || res.status;
  showToast(`"${message[0]}" ${statusLabel} — 대상 ${res.estimated_recipients.toLocaleString()}명${res.detail ? " · " + res.detail : ""}`);
  render();
}

function showToast(msg) {
  state.toast = msg; render();
  setTimeout(() => { state.toast = null; render(); }, 3200);
}

function renderLineChart(trends) {
  const W = 640, H = 260, padL = 40, padB = 26, padT = 10, padR = 10;
  const months = trends.months;
  const maxV = Math.max(...trends.growth, ...trends.stable, ...trends.dormant) * 1.1;
  const x = i => padL + (i/(months.length-1)) * (W - padL - padR);
  const y = v => H - padB - (v/maxV) * (H - padT - padB);
  const line = arr => arr.map((v,i) => `${i===0?"M":"L"} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
  const seriesDefs = [["growth","#2E7D32"],["stable","#1F3864"],["dormant","#B23B3B"]];
  const gridLines = [0,0.25,0.5,0.75,1].map(t => {
    const yy = H - padB - t*(H-padT-padB);
    return `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#E4DFD3" stroke-width="1"/>`;
  }).join("");
  const xLabels = months.map((m,i) => `<text x="${x(i)}" y="${H-8}" font-size="10" fill="#8A8F9C" text-anchor="middle" font-family="var(--font-data)">${m.slice(5)}월</text>`).join("");
  const paths = seriesDefs.map(([key,color]) => `<path d="${line(trends[key])}" fill="none" stroke="${color}" stroke-width="2.4"/>` +
    trends[key].map((v,i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${color}"/>`).join("")).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">${gridLines}${paths}${xLabels}</svg>`;
}

    dormant: [["네이버 / 카카오 / Facebook","강한 가격 인센티브 윈백","오랜만이에요 — 지금 30% 할인으로 다시 만나요", "kakao"],

  };

    ${segs.map(s => `

              <div class="msg-format">${esc(m[1])}</div>
              <div class="msg-copy">"${esc(m[2])}"</div>

            <button class="btn" onclick='openSendModal("${s.id}", ${JSON.stringify(m)})'>${m[3] ? "발송" : "광고 관리자 안내"}</button>
          </div>

    <div class="section-label">발송 이력</div>
    ${state.campaignLog.length === 0 ? `<div class="empty-state">아직 발송 이력이 없습니다.</div>` : `

        ${state.campaignLog.map(l => {
          const label = { sent: "발송 완료", simulated: "시뮬레이션", partial: "일부 발송", failed: "발송 실패", skipped: "발송 불가(광고 채널)" }[l.status] || l.status;
          const color = l.status === "sent" ? "var(--green)" : l.status === "failed" ? "var(--brick)" : l.status === "skipped" ? "var(--ink-faint)" : "var(--brass)";

function renderModal() {
  if (!state.modal) return "";
  const { segmentId, message } = state.modal;
  const seg = state.summary.segments.find(s => s.id === segmentId);
  const gateway = message[3];
  return `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-box">
        <h3>${gateway ? "캠페인 발송 확인" : "광고 채널 안내"}</h3>
        <p>
          ${gateway ? `
            <b>${SEGMENT_META[segmentId].name}</b> 세그먼트 <b>${seg.n.toLocaleString()}명</b>에게<br/>
            <b>${esc(gateway)}</b> 게이트웨이로 아래 메시지를 발송합니다.<br/><br/>
            <i>"${esc(message[2])}"</i><br/><br/>
            게이트웨이 자격증명이 설정되어 있지 않으면 자동으로 시뮬레이션 처리됩니다.
          ` : `
            "${esc(message[0])}"는 개별 API로 1:1 발송하는 채널이 아니라 광고 관리자(Meta/TikTok Ads Manager 등)에서<br/>
            캠페인으로 직접 집행해야 하는 채널입니다. 아래 카피를 광고 관리자에 입력해 집행해주세요.<br/><br/>
            <i>"${esc(message[2])}"</i>
          `}
        </p>
        <div class="modal-actions">
          <button class="btn ghost" style="border:1px solid var(--ink)" onclick="closeModal()">${gateway ? "취소" : "닫기"}</button>
          ${gateway ? `<button class="btn" onclick="confirmSend()">발송 확정</button>` : ""}
        </div>
      </div>
    </div>
  `;
}

function render() {
  const body = state.tab === "overview" ? renderOverview()
             : state.tab === "trends" ? renderTrends()
             : state.tab === "search" ? renderSearch()
             : renderCampaign();
  document.getElementById("root").innerHTML = `
    <div class="wrap">
      ${renderTopbar()}
      ${body}
      <footer>
        API 서버: <span id="api-status" style="color:${state.apiStatus==="connected"?"var(--green)":state.apiStatus==="offline"?"var(--brick)":"var(--ink-faint)"}">${state.apiStatus==="connected"?"연결됨 ✓":state.apiStatus==="offline"?"미연결 — 목업 데이터로 표시 중":"확인 중…"}</span> (API_BASE = ${esc(API_BASE)})<br/>
        발송 이력은 이 브라우저의 localStorage에 저장됩니다 (다른 기기/브라우저와는 공유되지 않음).
      </footer>
    </div>
    ${renderModal()}
    ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ""}
  `;
}

init();
