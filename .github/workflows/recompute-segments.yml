name: Recompute customer segments

# 매달 1일 UTC 18:00(한국시간 다음날 03:00)에 자동 실행 + 언제든 수동 실행 가능
on:
  schedule:
    - cron: "0 18 1 * *"
  workflow_dispatch: {}

jobs:
  recompute:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 결과 파일을 저장소에 커밋하기 위해 필요

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run clustering pipeline
        run: python scripts/run_clustering.py

      - name: Commit updated segment data (변경사항 있을 때만)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/segment_summary.json data/segment_trends.json data/segment_migration.json data/segment_snapshots/
          if git diff --cached --quiet; then
            echo "변경사항 없음 — 커밋 생략"
          else
            git commit -m "chore: recompute customer segments [automated]"
            git push
          fi
